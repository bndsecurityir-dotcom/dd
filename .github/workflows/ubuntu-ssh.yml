name: Ubuntu Tailscale Root Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-ubuntu-server"

          sleep 5

      # ==========================================
      # 2. Install & Configure SSH
      # ==========================================
      - name: Configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

          sudo systemctl enable --now ssh

          # Set root password
          echo 'root:Omidaak123@' | sudo chpasswd

          # Enable root login
          sudo sed -i \
            's/^#\?PermitRootLogin.*/PermitRootLogin yes/' \
            /etc/ssh/sshd_config

          # Enable password authentication
          sudo sed -i \
            's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          # Make sure these settings exist
          if ! grep -q '^PermitRootLogin' /etc/ssh/sshd_config; then
            echo 'PermitRootLogin yes' | sudo tee -a /etc/ssh/sshd_config
          fi

          if ! grep -q '^PasswordAuthentication' /etc/ssh/sshd_config; then
            echo 'PasswordAuthentication yes' | sudo tee -a /etc/ssh/sshd_config
          fi

          sudo systemctl restart ssh

      # ==========================================
      # 3. Display Server Information
      # ==========================================
      - name: Show Server Information
        run: |
          TS_IP=$(sudo tailscale ip -4)

          echo ""
          echo "=================================================="
          echo "          UBUNTU SERVER IS READY"
          echo "=================================================="
          echo ""
          echo "Tailscale IP : $TS_IP"
          echo "SSH User     : root"
          echo "SSH Password : Omidaak123@"
          echo ""
          echo "Windows CMD:"
          echo "ssh root@$TS_IP"
          echo ""
          echo "=================================================="

          echo ""
          echo "Tailscale Status:"
          sudo tailscale status

          echo ""
          echo "SSH Status:"
          sudo systemctl status ssh --no-pager

      # ==========================================
      # 4. Keep Server Alive - 6 Hours
      # ==========================================
      - name: Keep Server Alive
        run: |
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Ubuntu server running..."
          done
