name: Ubuntu VLESS TCP Public

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. Install Xray
      # ==========================================
      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          sudo systemctl enable xray

          sudo xray version

      # ==========================================
      # 2. Generate UUID
      # ==========================================
      - name: Generate UUID
        id: uuid
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID=$UUID" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 3. Configure VLESS TCP
      # ==========================================
      - name: Configure Xray VLESS TCP
        env:
          UUID: ${{ steps.uuid.outputs.UUID }}
        run: |
          sudo mkdir -p /usr/local/etc/xray

          sudo tee /usr/local/etc/xray/config.json > /dev/null <<EOF
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$UUID",
                      "email": "github-vless"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "none"
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF

          sudo xray run -test \
            -config /usr/local/etc/xray/config.json

          sudo systemctl restart xray

          sleep 3

          sudo systemctl --no-pager status xray

      # ==========================================
      # 4. Install ngrok
      # ==========================================
      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok version

      # ==========================================
      # 5. Authenticate ngrok
      # ==========================================
      - name: Configure ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

      # ==========================================
      # 6. Start Public TCP Tunnel
      # ==========================================
      - name: Start Public TCP Tunnel
        env:
          UUID: ${{ steps.uuid.outputs.UUID }}
        run: |
          nohup ngrok tcp 8080 > /tmp/ngrok.log 2>&1 &

          sleep 8

          echo ""
          echo "=============================================="
          echo "       NGROK PUBLIC TCP TUNNEL"
          echo "=============================================="

          cat /tmp/ngrok.log || true

          echo ""
          echo "=============================================="

      # ==========================================
      # 7. Get Public Address
      # ==========================================
      - name: Generate VLESS Config
        env:
          UUID: ${{ steps.uuid.outputs.UUID }}
        run: |
          sleep 3

          NGROK_ADDR=$(curl -s http://127.0.0.1:4040/api/tunnels \
            | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          t=d['tunnels'][0]
          print(t['public_url'].replace('tcp://',''))
          ")

          HOST=$(echo "$NGROK_ADDR" | cut -d: -f1)
          PORT=$(echo "$NGROK_ADDR" | cut -d: -f2)

          echo ""
          echo "===================================================="
          echo "             VLESS TCP SERVER READY"
          echo "===================================================="
          echo ""
          echo "Public Host : $HOST"
          echo "Public Port : $PORT"
          echo "Protocol    : VLESS"
          echo "Transport   : TCP"
          echo "Security    : NONE"
          echo "UUID        : $UUID"
          echo ""
          echo "VLESS CONFIG:"
          echo ""
          echo "vless://$UUID@$HOST:$PORT?type=tcp&security=none#GitHub-VLESS"
          echo ""
          echo "===================================================="

      # ==========================================
      # 8. Keep Server Alive - 6 Hours
      # ==========================================
      - name: Keep Server Alive
        run: |
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] VLESS server running... [$i/360]"
          done
