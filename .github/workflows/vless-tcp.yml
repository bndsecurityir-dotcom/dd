name: Ubuntu VLESS TCP Tailscale

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. Install Tailscale
      # ==========================================
      - name: Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-vless-server"

          sleep 5

          echo "Tailscale status:"
          sudo tailscale status

      # ==========================================
      # 2. Install Xray
      # ==========================================
      - name: Install Xray
        run: |
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

          sudo systemctl enable xray

          sudo xray version

      # ==========================================
      # 3. Generate UUID
      # ==========================================
      - name: Generate UUID
        id: uuid
        run: |
          UUID=$(cat /proc/sys/kernel/random/uuid)

          echo "UUID=$UUID" >> "$GITHUB_OUTPUT"

          echo "Generated UUID:"
          echo "$UUID"

      # ==========================================
      # 4. Configure Xray VLESS TCP
      # ==========================================
      - name: Configure Xray
        env:
          UUID: ${{ steps.uuid.outputs.UUID }}
        run: |

          TS_IP=$(sudo tailscale ip -4)

          echo "Tailscale IP:"
          echo "$TS_IP"

          sudo tee /usr/local/etc/xray/config.json > /dev/null <<EOF
          {
            "log": {
              "loglevel": "warning"
            },
            "inbounds": [
              {
                "listen": "$TS_IP",
                "port": 8080,
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$UUID",
                      "email": "github-vless"
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "none"
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom"
              }
            ]
          }
          EOF

          echo "Testing Xray configuration..."

          sudo xray run -test \
            -config /usr/local/etc/xray/config.json

          sudo systemctl restart xray

          sleep 3

      # ==========================================
      # 5. Check Server
      # ==========================================
      - name: Check VLESS Server
        env:
          UUID: ${{ steps.uuid.outputs.UUID }}
        run: |

          TS_IP=$(sudo tailscale ip -4)

          echo ""
          echo "===================================================="
          echo "             VLESS TCP SERVER READY"
          echo "===================================================="
          echo ""
          echo "Tailscale IP : $TS_IP"
          echo "Port         : 8080"
          echo "Protocol     : VLESS"
          echo "Transport    : TCP"
          echo "Security     : NONE"
          echo "UUID         : $UUID"
          echo ""
          echo "VLESS CONFIG:"
          echo ""
          echo "vless://$UUID@$TS_IP:8080?type=tcp&security=none#GitHub-VLESS"
          echo ""
          echo "===================================================="

          echo ""
          echo "Listening:"
          sudo ss -lntp | grep 8080 || true

          echo ""
          echo "Xray status:"
          sudo systemctl --no-pager status xray

      # ==========================================
      # 6. Keep Server Alive - 6 Hours
      # ==========================================
      - name: Keep Server Alive
        run: |

          for i in $(seq 1 360); do
            sleep 60

            TS_IP=$(sudo tailscale ip -4)

            echo "[$i/360] VLESS running - $TS_IP:8080"
          done
